# About Section
about_title: About Me
about_profile_image: images/rocket.png
about_content: | # this will include new lines to allow paragraphs
  Cloud and DevOps Consultant with 15+ years of experience in application support, monitoring, cloud migration, and platform engineering across AWS and GCP. Proven track record of working in fast-paced teams, driving digital transformation, and building resilient cloud solutions. Strong background in scripting, automation, and stakeholder engagement.

content:
  - title: Client Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: An Australian Bank
        quote: >
          Feburary 2022 - Present
        description: | # this will include new lines to allow paragraphs
          - Led a 3-person team to help client exit on-prem data centers and migrate to Google Cloud Platform (GCP).  
          - Designed and built secure GCP environments aligned with client DevOps practices.  
          - Collaborated cross-functionally to embed best practices and ensure successful cloud adoption.
      - layout: left
        title: An Australian FinTech company
        quote: >
          April 2020 - January 2022
        description: | # this will include new lines to allow paragraphs
          - Embedded in client DevOps teams to re-platform on-prem workloads to AWS.  
          - Conducted upskilling sessions in partnership with AWS Professional Services to accelerate cloud maturity.  
          - Designed infrastructure as code, CI/CD pipelines, and security-first cloud deployments.
      - layout: left
        title: An Australian Bank
        quote: >
          June - December 2021
        description: | # this will include new lines to allow paragraphs
          Worked within a team of developers and data engineers focused on delivering an internal product, which was a crucial component of the company's data lake in AWS. My primary role was managing the infrastructure using <mark>Terraform</mark>, <mark>Packer</mark>, <mark>Ansible</mark>, and <mark>Jenkins</mark>.
      - layout: left
        title: A Victorian State Government Agency
        quote: >
          June 2021
        description: | # this will include new lines to allow paragraphs
          This was a short engagement that involved bootstrapping Azure accounts using Servian's custom solutions (<mark>Terraform</mark> & <mark>Azure DevOps</mark>) to lay the foundation for the client's data pipelines. The work primarily focused on two areas: setting up the environment and pipelines, and upskilling the client's engineers so they could maintain the solution independently.
      - layout: left
        title: An Australian Retailer
        quote: >
          Feburary 2020 - April 2020
        description: | # this will include new lines to allow paragraphs
          Designed and implemented a custom solution using AWS networks and services to connect on-premises IBM AIX systems to third-party systems. The solution, built with <mark>ELB</mark>, <mark>Cognito</mark>, and <mark>AWS PrivateLink</mark>, was a secure proxy running in AWS that handled connection requests between on-premises and third-party systems. The chosen Infrastructure as Code (IaC) tool was AWS <mark>CloudFormation</mark>, which was the standard in the client's organization. The custom solution also included integration with the client's Azure Active Directory for user authentication via AWS Cognito.

